{{- if not .Values.secrets.existingSecret }}
{{- $v := .Values.secrets.values }}
{{- $_ := required "defina secrets.values.CODE_INDEX_AUTH_SECRET (>= 32 caracteres) ou secrets.existingSecret" $v.CODE_INDEX_AUTH_SECRET }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "code-index.secretName" . }}
  labels:
    {{- include "code-index.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $val := $v }}
  {{- if $val }}
  {{ $k }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- if .Values.database.url }}
---
# URL do banco: hook (existe antes do Job de migrations) e mantido entre upgrades.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "code-index.fullname" . }}-db
  labels:
    {{- include "code-index.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  POSTGRES_URL: {{ .Values.database.url | quote }}
{{- end }}
