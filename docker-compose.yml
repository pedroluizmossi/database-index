services:
  postgres:
    # pgvector/pgvector:pg17 + pg_search (BM25). Mesmo volume e mesmo pgvector da imagem anterior.
    build: ./docker/postgres
    image: code-index-postgres:pg17-pgsearch0.26.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: cocoindex
      POSTGRES_PASSWORD: cocoindex
      POSTGRES_DB: cocoindex
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocoindex"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
