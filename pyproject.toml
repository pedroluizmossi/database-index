[project]
name = "code-index"
version = "0.1.0"
description = "Indexador de código (git/GitHub) com CocoIndex, Voyage Code e pgvector, com CLI e servidor MCP"
authors = [
    { name = "Pedro Luiz Mossi", email = "pedroluizmossi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "cocoindex>=1.1.0",
    "fastapi>=0.162.0",
    "itsdangerous>=2.2.0",
    "litellm>=1.108.0",
    "markdownify>=1.2.3",
    "mcp[cli]>=2.3.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
code-index = "code_index.interfaces.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: precisa do Postgres do docker-compose (sem chamadas à Voyage)"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
